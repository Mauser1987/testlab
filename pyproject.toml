[project]
name = "testlab"
version = "0.1.0"
description = "TestLab — Test Lifecycle Management for the wet-seal test laboratory"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.1",
    "docxtpl>=0.20",
    # TCN PDF renderer; needs the Pango system library. One major version: the PDF layout must not shift unnoticed.
    "weasyprint>=70,<71",
    # TCN PDF renderer under validation (TESTLAB_TCN_RENDERER=chromium); pinned with its Chromium build
    # (python -m playwright install chromium): the PDF layout must not shift unnoticed.
    "playwright==1.49.1",
    # Result pictures: validation, size and display copies (the originals are stored unchanged).
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "pypdf>=5"]
postgres = ["psycopg[binary]>=3.2"]
# Optional Microsoft Word PDF backend (TESTLAB_PDF_CONVERTER=word); installs nothing outside Windows.
word = ["pywin32>=306; sys_platform == 'win32'"]

[tool.setuptools]
# Application, not a library: the install only pulls in dependencies.
# The code runs from app/ (manage.py, pytest pythonpath).
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["test_*.py"]
markers = [
    "libreoffice: uses the real LibreOffice PDF conversion (skipped when soffice is not installed)",
    "word: uses the real Microsoft Word PDF conversion (skipped unless Windows with Word and pywin32)",
    "chromium: uses the real Playwright/Chromium PDF renderer (skipped when Chromium is not installed)",
]
