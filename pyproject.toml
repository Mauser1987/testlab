[project]
name = "testlab"
version = "0.1.0"
description = "TestLab — Test Lifecycle Management for the wet-seal test laboratory"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.1",
    # PDF renderer (TCN, Test Run Report); pinned with its Chromium build
    # (python -m playwright install chromium): the PDF layout must not shift unnoticed.
    "playwright==1.49.1",
    # Result pictures: validation, size and display copies (the originals are stored unchanged).
    "pillow>=10",
    # Excel manual-log import (.xlsx only; legacy .xls must be saved as .xlsx first).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# tinyhtml5: text of rendered document templates in regression tests.
dev = ["pytest>=8", "pytest-django>=4.9", "pypdf>=5", "tinyhtml5>=2"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools]
# Application, not a library: the install only pulls in dependencies.
# The code runs from app/ (manage.py, pytest pythonpath).
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["test_*.py"]
markers = [
    "chromium: prints real PDFs with Playwright/Chromium (skipped when Chromium is not installed); other tests use a fast stand-in",
]
